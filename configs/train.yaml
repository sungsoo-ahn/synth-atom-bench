defaults:
  - data: multibody_23_N20_T1.0
  - model: transformer
  - logging: logging
  - _self_

train:
  max_steps: 100000
  budget: null  # if set, overrides max_steps = budget / flops_per_step
  batch_size: 256
  lr: 3e-4
  weight_decay: 1e-4
  warmup_fraction: 0.05
  grad_clip_norm: 1.0
  seed: 42

eval:
  every_n_steps: 5000
  n_samples: 1000
  n_ode_steps: 100
  sample_batch_size: 256
  early_stopping_patience: 0  # 0 = disabled; stop after N evals with no improvement

checkpoint:
  every_n_steps: 10000
  dir: null

augmentation:
  random_rotation: true

hydra:
  job:
    chdir: false
